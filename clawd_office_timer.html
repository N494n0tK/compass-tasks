<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawd Office — Focus Timer</title>
<style>
  :root{
    --clay:#D77656;
    --clay-soft:rgba(215,118,86,.16);
    --txt:#FFFFFF;
    --txt2:rgba(255,255,255,.62);
    --txt3:rgba(255,255,255,.40);
    --line:rgba(255,255,255,.16);
    --surface:rgba(22,22,22,.74);
    --raised:rgba(255,255,255,.07);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:#121212; color:var(--txt); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{position:fixed; inset:0; display:flex}
  #stage{position:absolute; inset:0}
  #scene{display:block; width:100%; height:100%}

  /* ---------- timer panel ---------- */
  .panel{
    position:absolute; top:50%; right:28px; transform:translateY(-50%);
    width:352px; max-height:calc(100% - 40px); overflow:auto;
    padding:24px 24px 20px; border-radius:12px;
    background:rgba(20,20,20,.62); border:1px solid var(--line);
    -webkit-backdrop-filter:blur(26px) saturate(115%); backdrop-filter:blur(26px) saturate(115%);
    box-shadow:0 1px 2px rgba(0,0,0,.35), 0 18px 48px rgba(0,0,0,.45);
    scrollbar-width:thin;
  }
  .panel::-webkit-scrollbar{width:6px}
  .panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16); border-radius:3px}

  .phead{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--txt3); font-weight:600}
  .badge{
    font-size:11px; font-weight:600; padding:5px 10px; border-radius:999px; white-space:nowrap;
    background:var(--raised); color:var(--txt2); border:1px solid var(--line);
  }
  .badge.on{background:var(--clay-soft); border-color:rgba(215,118,86,.5); color:#F2B79C}

  .time{
    margin:14px 0 2px; font-size:60px; line-height:1.05; font-weight:600; letter-spacing:-.02em;
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum";
  }
  .sub{font-size:13px; color:var(--txt3); margin-bottom:14px}
  .bar{height:4px; border-radius:999px; background:rgba(255,255,255,.10); overflow:hidden; margin-bottom:18px}
  .bar i{display:block; height:100%; width:0%; border-radius:999px; background:var(--clay); transition:width .3s linear}

  .label{font-size:12px; font-weight:600; color:var(--txt2); margin:0 0 8px; display:flex; justify-content:space-between; align-items:baseline}
  .label b{font-size:12px; font-weight:600; color:var(--txt); font-variant-numeric:tabular-nums}

  .chips{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:7px}
  .chips.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hint{margin:10px 0 0; font-size:11.5px; line-height:1.6; color:var(--txt3)}
  .chip{
    width:100%; min-width:0; height:40px; padding:0 4px; border-radius:8px; cursor:pointer;
    background:var(--raised); border:1px solid transparent; color:var(--txt2); white-space:nowrap;
    font-size:13px; font-weight:500; font-family:inherit; transition:background .15s, color .15s, border-color .15s;
  }
  .chip:hover{background:rgba(255,255,255,.12); color:var(--txt)}
  .chip.sel{background:var(--clay-soft); border-color:rgba(215,118,86,.55); color:#F2B79C}

  .custom{display:flex; align-items:center; gap:8px; margin-top:10px}
  .stepper{display:flex; align-items:center; gap:2px; background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:2px; flex:1}
  .stepper button{
    width:32px; height:34px; border:0; border-radius:6px; background:transparent; color:var(--txt2);
    font-size:17px; line-height:1; cursor:pointer; font-family:inherit;
  }
  .stepper button:hover{background:rgba(255,255,255,.10); color:var(--txt)}
  .stepper input{
    width:100%; min-width:0; border:0; background:transparent; color:var(--txt); text-align:center;
    font-size:15px; font-weight:600; font-family:inherit; font-variant-numeric:tabular-nums; -moz-appearance:textfield;
  }
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  .stepper input:focus{outline:none}
  .unit{font-size:12px; color:var(--txt3); padding-right:8px}

  .actions{display:flex; gap:8px; margin-top:16px}
  .btn{
    height:46px; border-radius:8px; border:1px solid transparent; cursor:pointer; font-family:inherit;
    font-size:14px; font-weight:600; transition:filter .15s, background .15s;
  }
  .btn.primary{flex:2; background:var(--clay); color:#1A1210}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{flex:1; background:var(--raised); color:var(--txt2); border-color:var(--line)}
  .btn.ghost:hover{background:rgba(255,255,255,.12); color:var(--txt)}

  hr{border:0; border-top:1px solid var(--line); margin:20px 0}
  .field + .field{margin-top:16px}

  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:22px; background:transparent; cursor:pointer; margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{height:4px; border-radius:999px; background:rgba(255,255,255,.14)}
  input[type=range]::-moz-range-track{height:4px; border-radius:999px; background:rgba(255,255,255,.14)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#fff; margin-top:-6px;
    box-shadow:0 1px 4px rgba(0,0,0,.5);
  }
  input[type=range]::-moz-range-thumb{width:16px; height:16px; border:0; border-radius:50%; background:#fff}

  .foot{display:flex; align-items:center; justify-content:space-between; margin-top:18px; font-size:12px; color:var(--txt3)}
  .linkbtn{background:none; border:0; color:var(--txt3); font-size:12px; font-family:inherit; cursor:pointer; padding:6px; border-radius:6px}
  .linkbtn:hover{color:var(--txt); background:var(--raised)}

  :focus-visible{outline:2px solid #8FC0F0; outline-offset:2px}

  @media (max-width:900px){
    #app{flex-direction:column}
    #stage{position:relative; flex:1 1 auto; min-height:44vh}
    .panel{
      position:relative; top:auto; right:auto; transform:none; width:100%; max-height:none;
      border-radius:0; border-left:0; border-right:0; border-bottom:0; flex:0 0 auto;
      -webkit-backdrop-filter:none; backdrop-filter:none; background:#161616;
    }
    .time{font-size:48px}
  }
  @media (prefers-reduced-motion:reduce){ .bar i{transition:none} }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="scene"></canvas></div>

  <aside class="panel">
    <div class="phead">
      <span class="eyebrow">Focus with Clawd</span>
      <span class="badge" id="badge">待機中</span>
    </div>

    <div class="time" id="timeText">25:00</div>
    <div class="sub" id="subText">スタートすると、Clawdくんが PC を出して作業を始めます</div>
    <div class="bar"><i id="barFill"></i></div>

    <div class="label"><span>セッションの長さ</span></div>
    <div class="chips" id="presets">
      <button class="chip" data-min="5">5分</button>
      <button class="chip" data-min="15">15分</button>
      <button class="chip sel" data-min="25">25分</button>
      <button class="chip" data-min="45">45分</button>
      <button class="chip" data-min="60">60分</button>
    </div>
    <div class="custom">
      <div class="stepper">
        <button type="button" id="mmDown" aria-label="分を減らす">−</button>
        <input id="mm" type="number" min="0" max="600" step="1" value="25" aria-label="分">
        <span class="unit">分</span>
        <button type="button" id="mmUp" aria-label="分を増やす">+</button>
      </div>
      <div class="stepper">
        <button type="button" id="ssDown" aria-label="秒を減らす">−</button>
        <input id="ss" type="number" min="0" max="59" step="5" value="0" aria-label="秒">
        <span class="unit">秒</span>
        <button type="button" id="ssUp" aria-label="秒を増やす">+</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" id="startBtn">スタート</button>
      <button class="btn ghost" id="resetBtn">リセット</button>
    </div>
    <p class="hint">作業中のClawdくんをクリックすると、手を止めてこっちを見て、うーんと伸びをしてから作業に戻ります。</p>

    <hr>

    <div class="field">
      <div class="label"><span>時刻</span><b id="clockLabel">19:30</b></div>
      <div class="chips two" id="tmode" style="margin-bottom:9px">
        <button class="chip sel" data-m="fix">固定</button>
        <button class="chip" data-m="flow">タイマーと連動</button>
      </div>
      <input id="timeSlider" type="range" min="0" max="1439" step="1" value="1170" aria-label="部屋の時刻">
      <div class="chips" id="tod" style="margin-top:6px">
        <button class="chip" data-h="420">朝</button>
        <button class="chip" data-h="780">昼</button>
        <button class="chip" data-h="1080">夕</button>
        <button class="chip sel" data-h="1170">夜</button>
        <button class="chip" id="nowBtn">現在</button>
      </div>
    </div>

    <div class="field">
      <div class="label"><span>外の天気</span></div>
      <div class="chips" id="weather">
        <button class="chip sel" data-w="clear">快晴</button>
        <button class="chip" data-w="cloudy">くもり</button>
        <button class="chip" data-w="rain">雨</button>
        <button class="chip" data-w="snow">雪</button>
        <button class="chip" data-w="storm">雷雨</button>
      </div>
    </div>

    <div class="foot">
      <span id="sessions">完了セッション 0</span>
      <button class="linkbtn" id="soundBtn">🔔 終了音 ON</button>
    </div>
  </aside>
</div>

<script>
(function(){
"use strict";

/* =========================================================================
   Scene constants — coordinates follow the reference illustration
   ========================================================================= */
var SW = 1200, SH = 735;      // scene units
var P = 6;                    // dot lattice pitch
var DOT = 2.2;                // dot size
var CELL = 8.7;               // pixel-art cell (Clawd / laptop)
var WIN = { x:345, y:52, w:455, h:404 };   // window opening
var DESK = { x:500, y:517, w:295, h:18 };  // desk top board
var CX = 356 - CELL, CY = 428;             // Clawd sprite origin
var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

var cv = document.getElementById("scene");
var ctx = cv.getContext("2d");
var stage = document.getElementById("stage");

/* ---------------- small helpers ---------------- */
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hex2rgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function mixHex(a,b,t){ var A=hex2rgb(a), B=hex2rgb(b);
  return "rgb("+Math.round(A[0]+(B[0]-A[0])*t)+","+Math.round(A[1]+(B[1]-A[1])*t)+","+Math.round(A[2]+(B[2]-A[2])*t)+")"; }
function mixToHex(a,b,t){ var A=hex2rgb(a), B=hex2rgb(b), r=[0,0,0], i;
  for(i=0;i<3;i++){ r[i]=Math.round(A[i]+(B[i]-A[i])*t); }
  return "#"+r.map(function(v){ return ("0"+v.toString(16)).slice(-2); }).join(""); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function ss(x){ x = x<0?0:(x>1?1:x); return x*x*(3-2*x); }      /* smoothstep */

/* =========================================================================
   1. LINE ART  ->  DOT LATTICE
   ========================================================================= */
function newMask(){
  var c = document.createElement("canvas"); c.width = SW; c.height = SH;
  var g = c.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0,0,SW,SH);
  g.strokeStyle = "#fff"; g.fillStyle = "#fff";
  g.lineWidth = 4; g.lineCap = "butt"; g.lineJoin = "miter";
  return g;
}
function maskToDots(g){
  var d = g.getImageData(0,0,SW,SH).data, out = [], x, y, i, j, on, px, py;
  for(y=0; y<SH; y+=P){
    for(x=0; x<SW; x+=P){
      on = false;
      for(j=1; j<P-1 && !on; j++){
        for(i=1; i<P-1; i++){
          px = x+i; py = y+j;
          if(px<SW && py<SH && d[(py*SW+px)*4] > 110){ on = true; break; }
        }
      }
      if(on){ out.push(x,y); }
    }
  }
  return out;
}
function bake(dots, color, alpha, s){
  var c = document.createElement("canvas");
  c.width = Math.max(1,Math.ceil(SW*s)); c.height = Math.max(1,Math.ceil(SH*s));
  var g = c.getContext("2d");
  g.fillStyle = color; g.globalAlpha = alpha;
  var d = Math.max(1, Math.round(DOT*s)), o = (P*s - d)/2, i;
  for(i=0;i<dots.length;i+=2){ g.fillRect(Math.round(dots[i]*s+o), Math.round(dots[i+1]*s+o), d, d); }
  return c;
}

/* ---------------- drawing primitives on the mask ---------------- */
function L(g,x1,y1,x2,y2){ g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); }
function R(g,x,y,w,h){ g.strokeRect(x,y,w,h); }
function FR(g,x,y,w,h){ g.fillRect(x,y,w,h); }
function C(g,x,y,r){ g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.stroke(); }
function PL(g,pts,close){ var i; g.beginPath(); g.moveTo(pts[0][0],pts[0][1]);
  for(i=1;i<pts.length;i++){ g.lineTo(pts[i][0],pts[i][1]); } if(close){ g.closePath(); } g.stroke(); }
function star(g,x,y,r){ var i,a; for(i=0;i<8;i++){ a = i*Math.PI/4; L(g,x,y,x+Math.cos(a)*r,y+Math.sin(a)*r); } }
function sprig(g,x,y,r,n,seed){ var rd=rng(seed),i,a,rr,tx,ty;
  for(i=0;i<n;i++){ a = -Math.PI/2 + (rd()-0.5)*2.5; rr = r*(0.45+rd()*0.55);
    tx = x+Math.cos(a)*rr; ty = y+Math.sin(a)*rr;
    L(g,x,y,tx,ty); FR(g,tx-3,ty-3,6,6); } }

/* =========================================================================
   2. THE ROOM  (everything in front of the window opening)
   ========================================================================= */
function drawRoom(g){
  var i, x;

  /* --- wall base line + floor line (full width) --- */
  L(g,0,458,1200,458); L(g,0,466,1200,466);
  L(g,0,668,1200,668); L(g,0,676,1200,676);

  /* --- window frame --- */
  R(g, WIN.x, WIN.y, WIN.w, WIN.h);
  L(g, WIN.x+2, WIN.y+WIN.h-2, WIN.x+WIN.w-2, WIN.y+WIN.h-2);

  /* ================= LEFT WALL ================= */
  /* round frame with a little bloom inside */
  C(g,116,166,36); C(g,116,166,10); star(g,116,166,17);
  /* small square frame */
  R(g,80,222,74,84); star(g,117,264,15);
  /* big poster frame + abstract art */
  R(g,168,140,154,182);
  PL(g,[[186,200],[204,180],[226,196],[244,176],[244,200]]);
  R(g,256,170,50,32);
  PL(g,[[186,232],[186,268],[300,268],[300,232]]);
  PL(g,[[198,250],[222,238],[250,254],[276,240],[292,252]]);
  PL(g,[[186,300],[212,286],[240,302],[266,286],[300,300]]);

  /* wall shelf */
  R(g,52,396,258,8);
  /* plant on the shelf (spiky, with a hanging tendril) */
  sprig(g,96,378,52,11,7);
  PL(g,[[96,396],[88,414],[100,430],[86,444]]);
  /* little wave sculpture */
  PL(g,[[146,392],[158,368],[172,386],[186,364],[198,384],[204,372]]);
  /* arch ornament */
  PL(g,[[238,396],[238,368],[246,356],[266,356],[274,368],[274,396]]);
  C(g,256,378,8);

  /* ================= RIGHT SHELF UNIT ================= */
  L(g,818,190,818,548);
  R(g,818,190,382,8);   /* top board */
  R(g,818,288,382,8);   /* middle board */
  /* things standing on top of the unit */
  sprig(g,904,178,52,10,21);
  R(g,1042,140,66,50); PL(g,[[1050,182],[1068,158],[1082,172],[1100,150]]);
  /* middle shelf items : bars / squiggle / pie */
  R(g,840,252,20,36); R(g,864,226,20,62); R(g,888,242,20,46);
  PL(g,[[930,288],[930,254],[948,240],[966,256],[984,238],[996,252],[996,288]]);
  C(g,1138,258,30); L(g,1138,258,1138,228); L(g,1138,258,1166,266);
  /* lower shelf items */
  PL(g,[[1052,388],[1070,306],[1088,388]]); L(g,1070,340,1092,326); L(g,1070,356,1050,344);
  R(g,1100,326,38,32); PL(g,[[1138,332],[1148,336],[1148,348],[1138,352]]);
  R(g,1152,318,14,70); R(g,1170,326,12,62); PL(g,[[1188,388],[1196,320],[1200,320]]);
  /* drawer row */
  R(g,824,398,146,44); R(g,982,398,146,44); R(g,1140,398,60,44);
  L(g,860,420,934,420); L(g,1018,420,1092,420); L(g,1158,420,1184,420);

  /* ================= FLOOR PLANT (right) ================= */
  sprig(g,968,540,92,16,33);
  R(g,912,582,116,14);
  PL(g,[[922,596],[934,658],[1006,658],[1018,596]],false);
  L(g,934,658,1006,658);

  /* ================= LEFT CABINET / BIN ================= */
  PL(g,[[34,506],[46,474],[70,474],[80,506]]);
  R(g,0,506,176,176);
  R(g,12,540,138,48); R(g,12,598,138,48);
  L(g,60,564,102,564); L(g,60,622,102,622);
  /* waste basket */
  R(g,188,598,96,14);
  PL(g,[[196,612],[206,682],[268,682],[278,612]],false);
  for(i=0;i<5;i++){ x = 208 + i*14; L(g,x,616,x+2,678); }

  /* ================= CHAIR ================= */
  PL(g,[[272,462],[298,438],[338,462],[338,520],[272,520]],true);
  FR(g,338,553,130,13);
  FR(g,382,566,22,84);
  FR(g,344,656,132,13);
  L(g,394,650,346,662); L(g,394,650,470,662);

  /* ================= DESK ================= */
  FR(g, DESK.x, DESK.y, DESK.w, DESK.h);
  L(g, 572, 506, DESK.x + DESK.w, 506);
  FR(g,518,535,10,133);
  FR(g,758,535,10,133);

  /* ================= DESK LAMP (post) ================= */
  FR(g,734,454,8,63);
  L(g,720,514,752,514);
}

/* the shade sits in front of the window, so it is baked with the same
   contrast rule as the outdoor art (dark when the sky is bright) */
function drawLamp(g){
  g.beginPath();
  g.moveTo(642,454); g.quadraticCurveTo(688,392, 734,454); g.closePath(); g.fill();
}

/* =========================================================================
   3. OUTSIDE THE WINDOW  (tree + hills, clipped to the opening)
   ========================================================================= */
function drawOutside(g){
  var rd = rng(99), i, a, r, x, y;
  g.save();
  g.beginPath(); g.rect(WIN.x+4, WIN.y+4, WIN.w-8, WIN.h-8); g.clip();

  /* far ground + hills */
  L(g,349,450,796,450);
  PL(g,[[556,450],[642,384],[684,414],[726,374],[790,450]]);

  /* trunk (solid, tapering) */
  g.beginPath();
  g.moveTo(524,456); g.lineTo(552,302); g.lineTo(574,196); g.lineTo(596,118);
  g.lineTo(628,120); g.lineTo(624,212); g.lineTo(616,318); g.lineTo(614,456);
  g.closePath(); g.fill();

  /* limbs */
  g.lineWidth = 10;
  L(g,562,272,488,206); L(g,492,210,452,180);
  L(g,582,208,528,160);
  L(g,606,168,664,132);
  L(g,620,262,704,212); L(g,700,214,748,184);
  L(g,626,146,678,112);
  g.lineWidth = 6;
  L(g,470,192,438,168); L(g,730,196,764,172); L(g,540,150,506,124);
  g.lineWidth = 4;

  /* blossom canopy */
  for(i=0;i<560;i++){
    a = rd()*Math.PI*2; r = Math.pow(rd(),0.42)*124;
    x = 686 + Math.cos(a)*r*1.16; y = 200 + Math.sin(a)*r*0.86;
    FR(g, x, y, 6, 6);
  }
  for(i=0;i<240;i++){
    a = rd()*Math.PI*2; r = Math.pow(rd(),0.5)*74;
    x = 566 + Math.cos(a)*r*1.12; y = 136 + Math.sin(a)*r*0.9;
    FR(g, x, y, 6, 6);
  }
  for(i=0;i<130;i++){
    a = rd()*Math.PI*2; r = Math.pow(rd(),0.5)*58;
    x = 470 + Math.cos(a)*r*1.2; y = 190 + Math.sin(a)*r*0.85;
    FR(g, x, y, 6, 6);
  }
  /* drifting petals */
  for(i=0;i<34;i++){
    x = 380 + rd()*400; y = 180 + rd()*250;
    L(g, x, y, x+7, y+11);
  }
  g.restore();
}

/* =========================================================================
   4. CLAWD  — exact pixel grid taken from the illustration
   ========================================================================= */
var CLAWD = [
  ".XXXXXXXXXXXXXXXX...",
  ".XXXXXXXXXXXXXXXX...",
  ".XXXXXXXXXXXXXXXX...",
  ".XXXXXXEEXXXXXXEE...",
  ".XXXXXXEEXXXXXXEE...",
  ".XXXXXXXXXXXXXXXX...",
  ".XXXXXXXXXXXXXXXX...",
  ".XXXXXXXXXXXXXXXX...",
  ".XXXXXXXXXXXXXXXX...",
  ".XXXXXXXXXXXXXXXX...",
  ".XXXXXXXXXXXXXXXX...",
  ".XX..XX....XX..XX...",
  "XXX.XXX...XXX.XXX...",
  "XX..XX....XX..XX...."
];
var BODY = "#D77656", BODY_D = "#C1684C", EYE = "#141414";

function cellRect(col,row,w,h,dx,dy){
  ctx.fillRect(CX + col*CELL + (dx||0), CY + row*CELL + (dy||0),
               Math.ceil(w*CELL)+0.5, Math.ceil(h*CELL)+0.5);
}
/* One paw block = 3 cells x 4 rows, exactly the block in the illustration.
   Both paws are that size: in idle they sit perfectly on top of each other,
   so only the near one is visible — which is how the artwork reads. */
var ARM = { col:17, row:5, w:3, h:4 };
function paw(dx, dy, color, join){
  var x0 = CX + ARM.col*CELL, x = x0 + dx, w = Math.ceil(ARM.w*CELL)+0.5;
  /* the arm stays joined to his body: reaching forward stretches it out
     instead of leaving a gap */
  var lim = x0 - 2, left = (x > lim) ? x - (x - lim)*join : x;
  ctx.fillStyle = color;
  ctx.fillRect(left, CY + ARM.row*CELL + dy, (x + w) - left,
               Math.ceil(ARM.h*CELL)+0.5);
}

function drawClawd(t, st){
  var r, c, bob, ph, typ, look, rai, wig, gw, gaze, ex, ey, nx, ny, fx, fy;

  typ = st.typing; look = st.look; rai = st.raise;

  bob = 0;
  if(!reduced){
    bob = (typ > 0.45) ? (Math.sin(t/260) > 0.75 ? -1 : 0)
                       : (Math.sin(t/1700) > 0.6 ? -1 : 0);
  }
  bob -= 3 * rai;                    /* he stretches upward when he cheers */

  /* ---- body. His back (the left four columns) is shaded in the original
     artwork, so it is shaded here too. ---- */
  ctx.fillStyle = BODY;
  for(r=0;r<CLAWD.length;r++){
    for(c=5;c<CLAWD[r].length;c++){
      /* the eye cells are painted as body too, so a pupil that looks around
         never leaves a hole for the room behind him to show through */
      if(CLAWD[r].charAt(c) !== "."){ cellRect(c, r, 1, 1, 0, bob); }
    }
  }
  ctx.fillStyle = BODY_D;
  for(r=0;r<CLAWD.length;r++){
    for(c=0;c<5;c++){
      if(CLAWD[r].charAt(c) === "X"){ cellRect(c, r, 1, 1, 0, bob); }
    }
  }

  /* ---- paws. While typing, the far paw works in counter-phase to the near
     one — same size, but shaded because it sits in his shadow — and both
     travel a little back and forth as well as up and down. ---- */
  ph = reduced ? 0 : t/125;
  ny = -19 * typ * (0.5 + 0.5*Math.cos(ph));
  fy = -19 * typ * (0.5 + 0.5*Math.cos(ph + 2.7)) - 3.5*typ;
  nx =   5 * typ * Math.sin(ph*0.5);
  fx =   5 * typ * Math.sin(ph*0.5 + 2.2) + 6*typ;

  if(rai > 0.001){
    wig = reduced ? 0 : Math.sin(t/150)*2.4*rai;
    nx = nx*(1-rai) + (  8 + wig)*rai;
    ny = ny*(1-rai) + (-70 - wig)*rai;
    fx = fx*(1-rai) + (-26 - wig)*rai;
    fy = fy*(1-rai) + (-78 + wig)*rai;
  }
  paw(fx, fy + bob, BODY_D, 1 - rai);
  paw(nx, ny + bob, BODY,   1 - rai);

  /* ---- eyes: on the screen while he works, on you when you poke him ---- */
  gaze = clamp(st.gaze - look, 0, 1);
  ex = 2.8*gaze; ey = 1.9*gaze;
  ctx.save();
  ctx.beginPath();                   /* and they never slip off the face edge */
  ctx.rect(CX + CELL, CY - 4*CELL + bob, 15*CELL + Math.ceil(CELL) + 0.5, 18*CELL);
  ctx.clip();
  ctx.fillStyle = EYE;
  if(st.blink > 0){
    cellRect(7, 4, 2, 0.45, ex, bob+ey); cellRect(15, 4, 2, 0.45, ex, bob+ey);
  } else {
    gw = 0.16*look;
    cellRect(7-gw,  3-gw, 2+gw*2, 2+gw*2, ex, bob+ey);
    cellRect(15-gw, 3-gw, 2+gw*2, 2+gw*2, ex, bob+ey);
  }
  ctx.restore();
}

/* =========================================================================
   5. LAPTOP  — comes up from under the desk, lid opens, screen glows
   ========================================================================= */
/* geometry copied from the reference: keyboard slab on the desk, screen
   leaning back to the right, exactly like the illustration + gif */
var LT = { bx:512, bw:60, bh:8, by:515, hx:570, hy:515, len:52, th:9, open:0.62 };
var SHELL = "#E4DFD7", SHELL_D = "#B9B3AA";

function drawLaptop(t, st){
  var rise = st.laptopY, lid = st.lid, i, n, w, a, gl;
  if(st.laptopVis <= 0){ return; }

  ctx.save();
  /* clip so it really slides out of the desk */
  ctx.beginPath(); ctx.rect(0, 0, SW, DESK.y + 2); ctx.clip();
  ctx.globalAlpha = st.laptopVis;

  var by = rise;

  /* screen: swings up from lying flat on the keyboard to its open angle */
  a = (-Math.PI/2) * (1 - lid) + LT.open * lid;
  gl = (st.phase === "work") ? 1 : (lid > 0.6 ? 0.5 : 0);
  ctx.save();
  ctx.translate(LT.hx, LT.hy + by);
  ctx.rotate(a);
  ctx.fillStyle = SHELL;
  ctx.fillRect(-LT.th, -LT.len, LT.th, LT.len);
  ctx.fillStyle = SHELL_D;
  ctx.fillRect(-LT.th, -LT.len, LT.th, 2.5);
  /* light spilling from the face toward Clawd */
  if(gl > 0){
    ctx.fillStyle = "rgba(150,205,255," + (0.85*gl) + ")";
    ctx.fillRect(-LT.th - 2.4, -LT.len + 4, 2.4, LT.len - 8);
    ctx.fillStyle = "rgba(210,235,255," + (0.5*gl) + ")";
    n = 3;
    for(i=0;i<n;i++){
      w = 2.4 * (0.4 + 0.6*Math.abs(Math.sin((t/380) + i*1.9)));
      ctx.fillRect(-LT.th - 2.4, -LT.len + 9 + i*13, w, 6);
    }
  }
  ctx.restore();

  /* base / keyboard deck sitting on the desk */
  ctx.fillStyle = SHELL;
  ctx.fillRect(LT.bx, LT.by - LT.bh + by, LT.bw, LT.bh);
  ctx.fillStyle = SHELL_D;
  ctx.fillRect(LT.bx, LT.by - 2 + by, LT.bw, 2);
  ctx.restore();
}

   6. SKY / WEATHER

var KEYS = [
  {h:0,   top:"#070b1a", mid:"#0b1226", bot:"#161d36", light:"#7c8fc9", li:0.05, star:1.0},
  {h:5,   top:"#131a3a", mid:"#3a2e55", bot:"#6b4560", light:"#b08aa8", li:0.07, star:0.45},
  {h:6.5, top:"#3e4c86", mid:"#b0708a", bot:"#e9a46b", light:"#f0b183", li:0.13, star:0.0},
  {h:9,   top:"#5c93d6", mid:"#9cc4ec", bot:"#dceaf7", light:"#eaf2fb", li:0.17, star:0.0},
  {h:13,  top:"#4e8ad4", mid:"#8fbeea", bot:"#d6e9f8", light:"#ffffff", li:0.19, star:0.0},
  {h:16.5,top:"#6e8fd0", mid:"#e2a06c", bot:"#f3c98d", light:"#ffc489", li:0.15, star:0.0},
  {h:18.5,top:"#2e2c5e", mid:"#8a4b6b", bot:"#e0794f", light:"#e08a5a", li:0.10, star:0.15},
  {h:20,  top:"#111633", mid:"#1e2044", bot:"#39304f", light:"#8a7fb0", li:0.06, star:0.7},
  {h:24,  top:"#070b1a", mid:"#0b1226", bot:"#161d36", light:"#7c8fc9", li:0.05, star:1.0}
];
var WX = {
  clear : {tint:"#8aa4c8", amt:0.00, dim:1.00, clouds:0, rain:0, snow:0, bolt:false},
  cloudy: {tint:"#8e949c", amt:0.46, dim:0.62, clouds:5, rain:0, snow:0, bolt:false},
  rain  : {tint:"#5a6068", amt:0.60, dim:0.44, clouds:6, rain:110, snow:0, bolt:false},
  snow  : {tint:"#b9c2cc", amt:0.52, dim:0.56, clouds:5, rain:0, snow:70, bolt:false},
  storm : {tint:"#3a3f49", amt:0.74, dim:0.30, clouds:7, rain:150, snow:0, bolt:true}
};

var pal = null;
function buildPalette(minutes, weather){
  var h = minutes/60, i = 0, a, b, t, w = WX[weather];
  while(i < KEYS.length-2 && h > KEYS[i+1].h){ i++; }
  a = KEYS[i]; b = KEYS[i+1];
  t = clamp((h - a.h) / (b.h - a.h), 0, 1);
  t = t*t*(3-2*t);
  var p = {
    top  : mixToHex(a.top, b.top, t),
    mid  : mixToHex(a.mid, b.mid, t),
    bot  : mixToHex(a.bot, b.bot, t),
    light: mixToHex(a.light, b.light, t),
    li   : (a.li + (b.li-a.li)*t),
    star : (a.star + (b.star-a.star)*t),
    w    : w, weather: weather, hour: h
  };
  p.top = mixToHex(p.top, w.tint, w.amt);
  p.mid = mixToHex(p.mid, w.tint, w.amt);
  p.bot = mixToHex(p.bot, w.tint, w.amt);
  p.li  = p.li * w.dim;
  p.star = p.star * (1 - w.amt);
  p.bg = mixToHex("#121212", "#20242b", clamp(p.li*3.2, 0, 0.85));
  p.dotAlpha = clamp(0.52 + p.li*1.9, 0.5, 0.95);
  p.dotColor = mixToHex("#ffffff", p.light, 0.25);
  p.lampOn = p.li < 0.085;
  return p;
}

/* ---- particles ---- */
var drops = [], flakes = [], clouds = [], flash = 0, nextBolt = 6000, bolt = null;
function seedWeather(){
  var rd = rng(4242), i;
  drops = []; flakes = []; clouds = [];
  for(i=0;i<170;i++){ drops.push({x:WIN.x+rd()*WIN.w, y:WIN.y+rd()*WIN.h, v:520+rd()*380, l:12+rd()*16}); }
  for(i=0;i<90;i++){ flakes.push({x:WIN.x+rd()*WIN.w, y:WIN.y+rd()*WIN.h, v:26+rd()*34, p:rd()*6.28, a:0.45+rd()*0.5, s:2+Math.round(rd()*2)}); }
  for(i=0;i<8;i++){ clouds.push({x:rd()*WIN.w, y:WIN.y+18+rd()*130, w:110+rd()*130, h:26+rd()*22, v:5+rd()*9, o:0.10+rd()*0.16}); }
}
seedWeather();

function drawSky(t, dt){
  var w = pal.w, i, d, f, c, gx, gy, ang, sun, rd;

  ctx.save();
  ctx.beginPath(); ctx.rect(WIN.x+3, WIN.y+3, WIN.w-6, WIN.h-6); ctx.clip();

  var g = ctx.createLinearGradient(0, WIN.y, 0, WIN.y+WIN.h);
  g.addColorStop(0, pal.top); g.addColorStop(0.55, pal.mid); g.addColorStop(1, pal.bot);
  ctx.fillStyle = g; ctx.fillRect(WIN.x, WIN.y, WIN.w, WIN.h);

  /* stars */
  if(pal.star > 0.02){
    rd = rng(77); ctx.fillStyle = "#ffffff";
    for(i=0;i<70;i++){
      gx = WIN.x + rd()*WIN.w; gy = WIN.y + rd()*WIN.h*0.75;
      ctx.globalAlpha = pal.star * (0.25 + 0.75*Math.abs(Math.sin(t/900 + i)));
      ctx.fillRect(gx, gy, 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  /* clouds */
  for(i=0;i<w.clouds;i++){
    c = clouds[i];
    gx = WIN.x + ((c.x + t/1000*c.v) % (WIN.w + c.w*2)) - c.w;
    ctx.fillStyle = "rgba(255,255,255," + c.o + ")";
    ctx.beginPath();
    ctx.ellipse(gx, c.y, c.w*0.5, c.h*0.5, 0, 0, 6.3); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(gx + c.w*0.22, c.y - c.h*0.30, c.w*0.32, c.h*0.46, 0, 0, 6.3); ctx.fill();
  }

  /* outdoor line-art (tree, hills) */
  if(outLayer){ ctx.drawImage(outLayer, 0, 0, SW, SH); }

  /* rain */
  if(w.rain){
    ctx.strokeStyle = "rgba(196,220,255,.46)"; ctx.lineWidth = 1.6;
    ctx.beginPath();
    for(i=0;i<w.rain;i++){
      d = drops[i];
      d.y += d.v*dt; d.x += d.v*dt*0.16;
      if(d.y > WIN.y+WIN.h){ d.y = WIN.y - 20; d.x = WIN.x + Math.random()*WIN.w; }
      if(d.x > WIN.x+WIN.w){ d.x -= WIN.w; }
      ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.l*0.16, d.y - d.l);
    }
    ctx.stroke();
  }
  /* snow */
  if(w.snow){
    for(i=0;i<w.snow;i++){
      f = flakes[i];
      f.y += f.v*dt; f.x += Math.sin(t/1200 + f.p)*0.35;
      if(f.y > WIN.y+WIN.h){ f.y = WIN.y - 8; f.x = WIN.x + Math.random()*WIN.w; }
      ctx.fillStyle = "rgba(255,255,255," + f.a + ")";
      ctx.fillRect(f.x, f.y, f.s, f.s);
    }
  }
  /* lightning bolt */
  if(bolt && bolt.life > 0){
    ctx.strokeStyle = "rgba(255,255,255," + clamp(bolt.life*3,0,0.9) + ")";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(bolt.p[0][0], bolt.p[0][1]);
    for(i=1;i<bolt.p.length;i++){ ctx.lineTo(bolt.p[i][0], bolt.p[i][1]); }
    ctx.stroke();
  }

  ctx.restore();
}

/* light spilling from the window onto the floor */
function drawLight(){
  var a = clamp(pal.li*1.1 + flash*0.35, 0, 0.24), k, t, g;
  if(a < 0.012){ return; }
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.beginPath(); ctx.rect(0, WIN.y + WIN.h - 4, SW, SH); ctx.clip();
  /* three stacked trapezoids = soft-edged pool of light on the floor */
  for(k=0;k<3;k++){
    t = k/2;
    g = ctx.createLinearGradient(0, WIN.y + WIN.h, 0, SH - 10);
    g.addColorStop(0, "rgba(255,255,255," + (a*(0.42 - k*0.10)) + ")");
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(WIN.x + 30 - t*30, WIN.y + WIN.h - 4);
    ctx.lineTo(WIN.x + WIN.w - 30 + t*30, WIN.y + WIN.h - 4);
    ctx.lineTo(WIN.x + WIN.w + 40 + t*110, SH);
    ctx.lineTo(WIN.x - 40 - t*110, SH);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* warm desk-lamp pool at night + screen glow while working */
function drawGlow(st){
  var g;
  if(pal.lampOn){
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    g = ctx.createRadialGradient(688, 440, 12, 688, 440, 260);
    g.addColorStop(0, "rgba(255,198,124,.20)"); g.addColorStop(1, "rgba(255,198,124,0)");
    ctx.fillStyle = g; ctx.fillRect(420, 200, 540, 480);
    ctx.restore();
  }
  if(st.phase === "work" && st.laptopVis > 0.4){
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    g = ctx.createRadialGradient(578, 490, 8, 578, 490, 175);
    g.addColorStop(0, "rgba(150,200,255,.17)"); g.addColorStop(1, "rgba(150,200,255,0)");
    ctx.fillStyle = g; ctx.fillRect(380, 300, 400, 240);
    ctx.restore();
  }
}

/* small message above Clawd */
function drawToast(st){
  if(st.toastA <= 0.01){ return; }
  var txt = st.toast, x = 430, y = 372, pad = 14, w, h = 34;
  ctx.save();
  ctx.globalAlpha = st.toastA;
  ctx.font = "600 17px -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif";
  ctx.textBaseline = "middle";
  w = ctx.measureText(txt).width + pad*2;
  ctx.fillStyle = "rgba(18,18,18,.86)";
  ctx.strokeStyle = "rgba(255,255,255,.28)"; ctx.lineWidth = 1.5;
  ctx.beginPath();
  if(ctx.roundRect){ ctx.roundRect(x - w/2, y - h/2, w, h, 8); }
  else { ctx.rect(x - w/2, y - h/2, w, h); }
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  ctx.fillText(txt, x, y+1);
  ctx.fillStyle = "rgba(18,18,18,.86)";
  ctx.beginPath(); ctx.moveTo(x-7, y+h/2-1); ctx.lineTo(x+7, y+h/2-1); ctx.lineTo(x, y+h/2+9); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* =========================================================================
   7. LAYERS + RESIZE
   ========================================================================= */
var roomDots = null, outDots = null, lampDots = null;
var roomLayer = null, outLayer = null, lampLayer = null;
var S = 1, OX = 0, OY = 0, DPR = 1;

function computeDots(){
  var g1 = newMask(); drawRoom(g1);    roomDots = maskToDots(g1);
  var g2 = newMask(); drawOutside(g2); outDots  = maskToDots(g2);
  var g3 = newMask(); drawLamp(g3);    lampDots = maskToDots(g3);
}
function bakeLayers(){
  roomLayer = bake(roomDots, pal.dotColor, pal.dotAlpha, S);
  var m = hex2rgb(pal.mid), lum = (m[0]*0.299 + m[1]*0.587 + m[2]*0.114);
  var c, al;
  if(lum > 96){ c = mixToHex("#161a1f", pal.mid, 0.14); al = 0.80; }
  else { c = mixToHex("#ffffff", pal.mid, 0.30); al = clamp(pal.dotAlpha*0.95, 0.45, 0.92); }
  outLayer  = bake(outDots, c, al, S);
  lampLayer = bake(lampDots, c, al, S);
}
function resize(){
  var r = stage.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width  = Math.max(1, Math.round(r.width * DPR));
  cv.height = Math.max(1, Math.round(r.height * DPR));
  S = Math.max(cv.width / SW, cv.height / SH);
  OX = (cv.width  - SW*S) * 0.34;
  OY = (cv.height - SH*S) * 0.60;
  bakeLayers();
}

/* =========================================================================
   8. TIMER STATE
   ========================================================================= */
var st = {
  phase: "idle",        /* idle | open | work | pause | close | done */
  total: 25*60*1000,
  left : 25*60*1000,
  last : 0,
  anim : 0,
  laptopY: 70, lid: 0, laptopVis: 0,
  blink: 0, nextBlink: 2000,
  toast: "", toastA: 0, toastT: 0,
  typing: 0, look: 0, raise: 0, gaze: 0, react: -1,
  sessions: 0, sound: true
};

var el = {
  time: document.getElementById("timeText"),
  sub : document.getElementById("subText"),
  bar : document.getElementById("barFill"),
  badge: document.getElementById("badge"),
  start: document.getElementById("startBtn"),
  reset: document.getElementById("resetBtn"),
  mm: document.getElementById("mm"), ss: document.getElementById("ss"),
  clock: document.getElementById("clockLabel"),
  slider: document.getElementById("timeSlider"),
  sessions: document.getElementById("sessions"),
  sound: document.getElementById("soundBtn")
};

function fmt(ms){
  var s = Math.max(0, Math.ceil(ms/1000)), m = Math.floor(s/60);
  s = s % 60;
  if(m >= 60){
    var h = Math.floor(m/60); m = m % 60;
    return h + ":" + ("0"+m).slice(-2) + ":" + ("0"+s).slice(-2);
  }
  return ("0"+m).slice(-2) + ":" + ("0"+s).slice(-2);
}
function syncUI(){
  el.time.textContent = fmt(st.left);
  el.bar.style.width = (100 * (1 - st.left/st.total)) + "%";
  var lbl = {idle:"待機中", open:"準備中", work:"作業中", pause:"一時停止", close:"片づけ中", done:"完了"};
  el.badge.textContent = lbl[st.phase];
  el.badge.className = "badge" + (st.phase === "work" ? " on" : "");
  el.start.textContent = (st.phase === "work" || st.phase === "open") ? "一時停止"
                       : (st.phase === "pause" ? "再開" : "スタート");
  var subs = {
    idle : "スタートすると、Clawdくんが PC を出して作業を始めます",
    open : "PC を出しています…",
    work : "カタカタ…一緒に集中しましょう",
    pause: "手を止めて待っています",
    close: "PC をしまっています…",
    done : "おつかれさまでした！"
  };
  el.sub.textContent = subs[st.phase];
  cv.style.cursor = (st.phase === "work") ? "pointer" : "default";
  el.sessions.textContent = "完了セッション " + st.sessions;
}
function setDuration(ms, fromInputs){
  st.total = Math.max(5000, ms);
  st.left = st.total;
  if(!fromInputs){
    el.mm.value = Math.floor(st.total/60000);
    el.ss.value = Math.floor(st.total/1000) % 60;
  }
  syncUI();
}
function readInputs(){
  var m = parseInt(el.mm.value, 10), s = parseInt(el.ss.value, 10);
  if(isNaN(m) || m < 0){ m = 0; }
  if(isNaN(s) || s < 0){ s = 0; }
  if(s > 59){ s = 59; el.ss.value = 59; }
  if(m > 600){ m = 600; el.mm.value = 600; }
  setDuration(m*60000 + s*1000, true);
  document.querySelectorAll("#presets .chip").forEach(function(c){
    c.classList.toggle("sel", (+c.dataset.min)*60000 === st.total);
  });
}
function toast(msg, secs){ st.toast = msg; st.toastT = secs*1000; }

var actx = null;
function chime(){
  if(!st.sound){ return; }
  try{
    if(!actx){ actx = new (window.AudioContext || window.webkitAudioContext)(); }
    [880, 1174.7, 1567.9].forEach(function(f, i){
      var o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + i*0.16;
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + 1.0);
    });
  }catch(e){}
}

function start(){
  if(st.left <= 0){ st.left = st.total; }
  st.phase = "open"; st.anim = 0; syncUI();
  if(actx && actx.state === "suspended"){ actx.resume(); }
}
function pause(){ st.phase = "pause"; syncUI(); }
function resume(){ st.phase = "work"; syncUI(); }
function finish(){
  st.phase = "close"; st.anim = 0; st.sessions++;
  toast("おつかれさま！", 4.5); chime(); syncUI();
}
function reset(){
  st.left = st.total;
  st.phase = (st.laptopVis > 0.02) ? "close" : "idle";
  st.anim = 0; syncUI();
}

/* ---------------- UI wiring ---------------- */
el.start.addEventListener("click", function(){
  if(st.phase === "work" || st.phase === "open"){ pause(); }
  else if(st.phase === "pause"){ resume(); }
  else { start(); }
});
el.reset.addEventListener("click", reset);
document.querySelectorAll("#presets .chip").forEach(function(c){
  c.addEventListener("click", function(){
    document.querySelectorAll("#presets .chip").forEach(function(o){ o.classList.remove("sel"); });
    c.classList.add("sel");
    setDuration((+c.dataset.min)*60000);
    if(st.phase !== "idle" && st.phase !== "done"){ reset(); }
  });
});
["mm","ss"].forEach(function(id){
  document.getElementById(id).addEventListener("input", function(){
    readInputs();
    if(st.phase !== "idle" && st.phase !== "done"){ reset(); }
  });
});
function step(input, delta, min, max){
  var v = (parseInt(input.value,10) || 0) + delta;
  input.value = clamp(v, min, max);
  readInputs();
  if(st.phase !== "idle" && st.phase !== "done"){ reset(); }
}
document.getElementById("mmUp").addEventListener("click", function(){ step(el.mm, 1, 0, 600); });
document.getElementById("mmDown").addEventListener("click", function(){ step(el.mm, -1, 0, 600); });
document.getElementById("ssUp").addEventListener("click", function(){ step(el.ss, 5, 0, 59); });
document.getElementById("ssDown").addEventListener("click", function(){ step(el.ss, -5, 0, 59); });

var dayMin = 1170, dayMinF = 1170, weather = "clear", timeFlow = false, lastBake = 1170;
function clockText(m){
  m = Math.floor(m) % 1440;
  return ("0"+Math.floor(m/60)).slice(-2) + ":" + ("0"+(m%60)).slice(-2);
}
function applyScene(){
  dayMinF = dayMin; lastBake = dayMin;
  pal = buildPalette(dayMin, weather);
  el.clock.textContent = clockText(dayMin);
  bakeLayers();
}
/* time mode: hold the clock still, or let it run along with the timer */
document.querySelectorAll("#tmode .chip").forEach(function(c){
  c.addEventListener("click", function(){
    document.querySelectorAll("#tmode .chip").forEach(function(o){ o.classList.remove("sel"); });
    c.classList.add("sel");
    timeFlow = (c.dataset.m === "flow");
    dayMinF = dayMin;
  });
});
el.slider.addEventListener("input", function(){
  dayMin = +el.slider.value;
  document.querySelectorAll("#tod .chip").forEach(function(c){ c.classList.remove("sel"); });
  applyScene();
});
document.querySelectorAll("#tod .chip[data-h]").forEach(function(c){
  c.addEventListener("click", function(){
    document.querySelectorAll("#tod .chip").forEach(function(o){ o.classList.remove("sel"); });
    c.classList.add("sel");
    dayMin = +c.dataset.h; el.slider.value = dayMin; applyScene();
  });
});
document.getElementById("nowBtn").addEventListener("click", function(){
  var n = new Date();
  document.querySelectorAll("#tod .chip").forEach(function(o){ o.classList.remove("sel"); });
  this.classList.add("sel");
  dayMin = n.getHours()*60 + n.getMinutes();
  el.slider.value = dayMin; applyScene();
});
document.querySelectorAll("#weather .chip").forEach(function(c){
  c.addEventListener("click", function(){
    document.querySelectorAll("#weather .chip").forEach(function(o){ o.classList.remove("sel"); });
    c.classList.add("sel");
    weather = c.dataset.w; applyScene();
  });
});
el.sound.addEventListener("click", function(){
  st.sound = !st.sound;
  el.sound.textContent = st.sound ? "\uD83D\uDD14 終了音 ON" : "\uD83D\uDD15 終了音 OFF";
});
document.addEventListener("keydown", function(e){
  if(e.target.tagName === "INPUT"){ return; }
  if(e.code === "Space"){ e.preventDefault(); el.start.click(); }
  if(e.key === "r" || e.key === "R"){ reset(); }
});

/* give Clawd a poke while he is working */
function poke(){
  if(st.phase !== "work" || st.react >= 0){ return; }
  st.react = 0; st.blink = 120; st.nextBlink = 2600 + Math.random()*3200;
}
cv.addEventListener("click", poke);
cv.addEventListener("touchstart", function(){ poke(); }, {passive:true});

/* =========================================================================
   9. MAIN LOOP
   ========================================================================= */
function tick(now){
  var dt = st.last ? Math.min((now - st.last)/1000, 0.05) : 0.016;
  st.last = now;
  st.anim += dt*1000;

  /* ---- phase machine ---- */
  if(st.phase === "open"){
    st.laptopVis = 1;
    st.laptopY = 70 * clamp(1 - st.anim/430, 0, 1);
    st.lid = clamp((st.anim - 380)/420, 0, 1);
    if(st.anim > 830){ st.phase = "work"; st.laptopY = 0; st.lid = 1; syncUI(); }
  } else if(st.phase === "work"){
    st.left -= dt*1000;
    if(st.left <= 0){ st.left = 0; finish(); }
  } else if(st.phase === "close"){
    st.lid = clamp(1 - st.anim/420, 0, 1);
    st.laptopY = 70 * clamp((st.anim - 420)/460, 0, 1);
    st.laptopVis = 1 - clamp((st.anim - 700)/280, 0, 1);
    if(st.anim > 1000){
      st.phase = (st.left <= 0) ? "done" : "idle";
      st.laptopVis = 0; st.anim = 0; syncUI();
    }
  } else if(st.phase === "done"){
    if(st.anim > 3600){ st.left = st.total; st.phase = "idle"; syncUI(); }
  }
  if(st.phase === "work" || st.phase === "pause"){ st.laptopVis = 1; st.laptopY = 0; st.lid = 1; }
  if(st.phase === "idle" || st.phase === "done"){ if(st.laptopVis < 0.02){ st.laptopVis = 0; } }

  if(st.phase === "work" || st.phase === "pause"){ syncUI(); }

  /* ---- the clock either stays put, or runs along with the timer ---- */
  if(timeFlow && (st.phase === "work" || st.phase === "open")){
    dayMinF += dt * (st.total > 0 ? 120000/st.total : 0.08);   /* ~2 scene hours per session */
    if(dayMinF >= 1440){ dayMinF -= 1440; }
    dayMin = Math.floor(dayMinF);
    el.clock.textContent = clockText(dayMinF);
    el.slider.value = dayMin;
    pal = buildPalette(dayMinF, weather);
    if(Math.abs(dayMin - lastBake) >= 3){ lastBake = dayMin; bakeLayers(); }
  }

  /* ---- poke reaction: stop, look at you, big stretch, back to work ---- */
  if(st.react >= 0){
    st.react += dt*1000;
    if(st.react > 5050 || st.phase !== "work"){ st.react = -1; }
  }
  if(st.react < 0){
    st.typing += (((st.phase === "work") ? 1 : 0) - st.typing) * Math.min(1, dt*9);
    st.look   -= st.look  * Math.min(1, dt*9);
    st.raise  -= st.raise * Math.min(1, dt*9);
  } else {
    var rr = st.react;
    st.typing = (rr < 300) ? (1 - ss(rr/300)) : (rr > 4750 ? ss((rr-4750)/300) : 0);
    st.look   = (rr < 280) ? ss(rr/280) : (rr > 4400 ? 1 - ss((rr-4400)/520) : 1);
    st.raise  = (rr < 2100) ? 0
              : (rr < 2420 ? ss((rr-2100)/320)
              : (rr < 4420 ? 1 : 1 - ss((rr-4420)/360)));
  }
  st.gaze += (((st.phase === "work" && st.react < 0) ? 1 : 0) - st.gaze) * Math.min(1, dt*5);

  /* blink */
  st.nextBlink -= dt*1000;
  if(st.nextBlink <= 0){ st.blink = 130; st.nextBlink = 2600 + Math.random()*4200; }
  if(st.blink > 0){ st.blink -= dt*1000; }

  /* toast fade */
  if(st.toastT > 0){ st.toastT -= dt*1000; st.toastA = Math.min(1, st.toastA + dt*4); }
  else { st.toastA = Math.max(0, st.toastA - dt*2.5); }

  /* lightning */
  if(pal.w.bolt && !reduced){
    nextBolt -= dt*1000;
    if(nextBolt <= 0){
      nextBolt = 4200 + Math.random()*6000;
      flash = 1;
      var bx = WIN.x + 60 + Math.random()*(WIN.w-120), by = WIN.y + 10, pts = [[bx,by]], k;
      for(k=0;k<5;k++){ bx += (Math.random()-0.5)*70; by += 40 + Math.random()*40; pts.push([bx,by]); }
      bolt = { p: pts, life: 0.34 };
    }
  }
  if(flash > 0){ flash = Math.max(0, flash - dt*3.4); }
  if(bolt && bolt.life > 0){ bolt.life -= dt; }

  /* ---- draw ---- */
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = pal.bg;
  ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(S,0,0,S,OX,OY);

  drawSky(now, dt);
  drawLight();
  if(lampLayer){ ctx.drawImage(lampLayer, 0, 0, SW, SH); }
  if(roomLayer){ ctx.drawImage(roomLayer, 0, 0, SW, SH); }
  drawGlow(st);
  drawClawd(now, st);
  drawLaptop(now, st);
  drawToast(st);

  if(flash > 0.01){
    ctx.fillStyle = "rgba(226,238,255," + (flash*0.16) + ")";
    ctx.fillRect(0,0,SW,SH);
  }

  /* vignette */
  ctx.setTransform(1,0,0,1,0,0);
  var vg = ctx.createRadialGradient(cv.width*0.42, cv.height*0.5, Math.min(cv.width,cv.height)*0.28,
                                    cv.width*0.42, cv.height*0.5, Math.max(cv.width,cv.height)*0.78);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,.42)");
  ctx.fillStyle = vg; ctx.fillRect(0,0,cv.width,cv.height);

  requestAnimationFrame(tick);
}

/* =========================================================================
   10. BOOT
   ========================================================================= */
pal = buildPalette(dayMin, weather);
computeDots();
resize();
applyScene();
setDuration(25*60000);
syncUI();
window.addEventListener("resize", function(){ clearTimeout(window.__rt); window.__rt = setTimeout(resize, 120); });
requestAnimationFrame(tick);

})();
</script>
